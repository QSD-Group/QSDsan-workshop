# Execute every edition's notebooks end-to-end to catch breakage.
#
# Runs --nbval-lax: every cell is executed and only UNEXPECTED exceptions fail
# the run (deliberate teaching errors can be tagged `raises-exception`, which
# nbval honors). Output is not compared, so plots and version strings do not
# cause false failures.
#
# One job: each edition is installed from its own requirements.txt into a fresh
# virtual environment (what attendees get), so pins never cross editions. Must pass.
# Packages that an edition's requirements.txt does not pin (pandas, numpy, ...) are installed
# as the newest release, so the weekly run also catches those drifting.
#
# Triggers: weekly (catches upstream drift with no commit here), on demand, and
# on pushes/PRs that touch an edition folder or the environment files.

name: build-notebooks

on:
  schedule:
    - cron: "0 8 * * 1"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '[0-9][0-9][0-9][0-9]-*/**'
      - 'runtime.txt'
      - '.github/workflows/build-notebooks.yml'
  pull_request:
    paths:
      - '[0-9][0-9][0-9][0-9]-*/**'
      - 'runtime.txt'
      - '.github/workflows/build-notebooks.yml'

jobs:
  pinned:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v7
      with:
        python-version: "3.12"
        cache: "pip"
        cache-dependency-path: '[0-9][0-9][0-9][0-9]-*/requirements.txt'
    - name: Install graphviz
      # QSDsan's .diagram() shells out to graphviz `dot`.
      run: sudo apt-get update && sudo apt-get install -y graphviz
    - name: Run notebooks
      env:
        MPLBACKEND: Agg
      run: |
        # Each edition gets its own environment, then runs its notebooks from its own folder:
        # the 2022 notebooks import systems.py from there, and the 2026 notebooks read ../data.
        # A failing edition does not stop the others, but the job still fails.
        status=0
        for d in [0-9][0-9][0-9][0-9]-*/; do
          d="${d%/}"
          echo "::group::$d"
          python -m venv "$RUNNER_TEMP/venv-$d"
          . "$RUNNER_TEMP/venv-$d/bin/activate"
          python -m pip install --upgrade pip
          pip install -r "$d/requirements.txt" nbval
          # Notebooks are in the edition folder, or in its `notebooks/` subfolder.
          nbdir="$d"
          if [ -d "$d/notebooks" ]; then nbdir="$d/notebooks"; fi
          (cd "$nbdir" && pytest --nbval-lax --current-env --nbval-cell-timeout=300 \
            -o addopts="" -p no:cacheprovider *.ipynb) || status=1
          deactivate
          echo "::endgroup::"
        done
        exit $status
